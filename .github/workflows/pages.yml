name: Point GitHub Pages at the live site

# The site used to be a static export on GitHub Pages. It now needs a server for
# the order receipts and the PaySwitch payment routes, so the app is hosted
# elsewhere and this workflow leaves a redirect behind — otherwise the old Pages
# URL would serve a frozen copy of the site forever.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Build the redirect page
        env:
          TARGET: ${{ vars.SITE_URL || 'https://playman-lounge.vercel.app' }}
        run: |
          mkdir -p site
          cat > site/index.html <<HTML
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Play Man Lounge has moved</title>
              <link rel="canonical" href="$TARGET" />
              <meta http-equiv="refresh" content="0; url=$TARGET" />
              <style>
                body {
                  margin: 0;
                  min-height: 100vh;
                  display: grid;
                  place-items: center;
                  background: #3a1a04;
                  color: #f4e3bd;
                  font-family: Georgia, "Times New Roman", serif;
                  text-align: center;
                  padding: 2rem;
                }
                a { color: #c27b07; }
              </style>
            </head>
            <body>
              <main>
                <h1>Play Man Lounge</h1>
                <p>The site lives here now:</p>
                <p><a href="$TARGET">$TARGET</a></p>
              </main>
              <script>
                location.replace("$TARGET");
              </script>
            </body>
          </html>
          HTML
          cp site/index.html site/404.html

      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
