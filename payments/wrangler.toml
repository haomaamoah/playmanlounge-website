name = "playman-payments"
main = "src/index.ts"
compatibility_date = "2026-01-15"

# Secrets are never kept here. Set them once per environment with:
#   npx wrangler secret put THETELLER_API_USER
#   npx wrangler secret put THETELLER_API_KEY
#   npx wrangler secret put THETELLER_MERCHANT_ID
[vars]
THETELLER_MODE = "test"
ALLOWED_ORIGINS = "https://haomaamoah.github.io,http://127.0.0.1:43123,http://localhost:43123"
MAX_ORDER_TOTAL = "5000"
